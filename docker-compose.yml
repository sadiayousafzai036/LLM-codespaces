# Whole stack: database, one-shot ingestion, chat app, dashboard.
#
#   docker compose up --build
#
# Startup order is enforced rather than hoped for. `ingest` waits for Postgres
# to pass its healthcheck, and the two Streamlit apps wait for `ingest` to exit
# successfully, so neither ever comes up against an empty knowledge base.

x-app: &app
  build: .
  image: cooking-qa-assistant:latest
  env_file: .env
  environment:
    # Inside the network Postgres answers on its service name, whatever .env
    # says for local runs.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-cooking_assistant}
    POSTGRES_USER: ${POSTGRES_USER:-cooking}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cooking}
    # dlt writes its working files here; a named volume keeps load history
    # across runs.
    DLT_DATA_DIR: /app/.dlt-data
    PYTHONPATH: /app
  volumes:
    - dlt-data:/app/.dlt-data

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cooking_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-cooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cooking}
    ports:
      # Exposed so the evaluation scripts can run on the host against the same
      # database the containers use.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cooking} -d ${POSTGRES_DB:-cooking_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ingest:
    <<: *app
    command: ["python", "-m", "ingestion.run"]
    depends_on:
      postgres:
        condition: service_healthy
    # A one-shot job, not a service. It must not be restarted on exit.
    restart: "no"

  chat:
    <<: *app
    command:
      - streamlit
      - run
      - app/chat.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    depends_on:
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  dashboard:
    <<: *app
    command:
      - streamlit
      - run
      - app/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8502
      - --browser.gatherUsageStats=false
    ports:
      - "8502:8502"
    depends_on:
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  dlt-data:
